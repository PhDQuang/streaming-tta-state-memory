[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "history-tta"
version = "0.1.0"
description = "Controlled history interventions for test-time adaptation research"
requires-python = ">=3.10"
dependencies = ["torch>=2.9,<2.10", "torchvision>=0.24,<0.25", "numpy>=2.2,<2.3", "scipy>=1.13", "pandas>=2.3", "matplotlib>=3.9", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

